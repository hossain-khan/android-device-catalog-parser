name: Publish Device Catalog DB to Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag or branch to build from and publish to (default: main)'
        required: true
        default: 'main'
        type: string

jobs:
  publish-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build SQLite database
        run: ./gradlew :sample:run

      - name: Prepare database artifact
        id: db
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$INPUT_TAG" = "main" ]; then
            DB_NAME="device-catalog-SNAPSHOT.db"
            RELEASE_TAG="snapshot"
          else
            CLEAN_TAG="${INPUT_TAG#v}"
            DB_NAME="device-catalog-v${CLEAN_TAG}.db"
            RELEASE_TAG="$INPUT_TAG"
          fi

          cp sample/src/main/resources/devices.db "$DB_NAME"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Prepared $DB_NAME for release tag $RELEASE_TAG"

      - name: Attach database to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_NAME: ${{ steps.db.outputs.db_name }}
          RELEASE_TAG: ${{ steps.db.outputs.release_tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DB_NAME" --clobber
          elif [ "$INPUT_TAG" = "main" ]; then
            gh release create "$RELEASE_TAG" "$DB_NAME" \
              --target main \
              --prerelease \
              --title "Snapshot" \
              --notes "Automated SQLite device catalog snapshot built from \`main\`."
          else
            gh release create "$RELEASE_TAG" "$DB_NAME" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
